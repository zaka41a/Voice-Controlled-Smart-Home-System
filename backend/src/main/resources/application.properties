spring.application.name=voicehome
server.address=127.0.0.1
server.port=8080
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
voicehome.configuration-file=${VOICEHOME_CONFIG_FILE:data/configuration.json}
voicehome.database-file=${VOICEHOME_DATABASE_FILE:}
# Demonstration policy, to be calibrated with Saad's model.
voicehome.minimum-confidence=${VOICEHOME_MINIMUM_CONFIDENCE:0.80}
